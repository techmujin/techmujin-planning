name: Build PDF

on:
  push:
    branches:
      - main
      - feature/add-actions-workflow  # PDF ビルドのテスト用
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pdf-release
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/add-actions-workflow'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build PDF
        run: pnpm build

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: techmujin-planning-pdf
          path: techmujin_planning.pdf

      - name: Update release tag
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -f latest-pdf "${GITHUB_SHA}"
          git push origin refs/tags/latest-pdf --force

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-pdf
          name: Latest PDF
          body: |
            main ブランチの最新コミットから自動生成した PDF です。
          files: techmujin_planning.pdf
          fail_on_unmatched_files: true
          generate_release_notes: false
          append_body: false
          make_latest: true
          overwrite_files: true