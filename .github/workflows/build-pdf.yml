name: Build PDF

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pdf-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve PDF version
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "pdf_output=techmujin_planning-${VERSION}.pdf" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "pdf_output=techmujin_planning.pdf" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PDF
        env:
          VIVLIOSTYLE_THEME: ${{ github.event_name == 'pull_request' && 'themes/pr-draft.css' || 'themes/custom.css' }}
          PDF_OUTPUT_FILE: ${{ steps.meta.outputs.pdf_output }}
        run: pnpm build

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: techmujin-planning-pdf-${{ github.event_name }}-${{ github.sha }}
          path: ${{ steps.meta.outputs.pdf_output }}

      - name: Upload PR artifact summary
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "## PDF artifact"
            echo ""
            echo "- Artifact name: techmujin-planning-pdf-${GITHUB_EVENT_NAME}-${GITHUB_SHA}"
            echo "- PR checks from this workflow contain the downloadable file."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release asset
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.version }}
          body: |
            Git tag から生成した PDF です。
          files: ${{ steps.meta.outputs.pdf_output }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          append_body: false
          make_latest: true
          overwrite_files: true