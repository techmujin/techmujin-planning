name: Build PDF

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pdf-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve PDF version
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "pdf_output=techmujin_planning-${VERSION}.pdf" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "pdf_output=techmujin_planning.pdf" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PDF
        env:
          VIVLIOSTYLE_THEME: ${{ github.event_name == 'pull_request' && 'themes/pr-draft.css' || 'themes/custom.css' }}
          PDF_OUTPUT_FILE: ${{ steps.meta.outputs.pdf_output }}
        run: pnpm build

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: techmujin-planning-pdf-${{ github.event_name }}-${{ github.sha }}
          path: ${{ steps.meta.outputs.pdf_output }}

      - name: Upload PR artifact summary
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "## PDF artifact"
            echo ""
            echo "- Artifact name: techmujin-planning-pdf-${GITHUB_EVENT_NAME}-${GITHUB_SHA}"
            echo "- PR checks from this workflow contain the downloadable file."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build release notes
        if: github.event_name == 'push' && github.ref_type == 'tag'
        id: notes
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -Fvx "${CURRENT_TAG}" | head -n 1 || true)

          if [ -n "${PREV_TAG}" ]; then
            COMMITS=$(git log --pretty='- %s (%h)' "${PREV_TAG}..${CURRENT_TAG}" || true)
            COMPARE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${CURRENT_TAG}"
            RANGE_TEXT="${PREV_TAG}..${CURRENT_TAG}"
          else
            COMMITS=$(git log --pretty='- %s (%h)' "${CURRENT_TAG}" || true)
            COMPARE_URL=""
            RANGE_TEXT="初回リリース"
          fi

          if [ -z "${COMMITS}" ]; then
            COMMITS='- 変更なし'
          fi

          {
            echo "release_body<<EOF"
            echo "## ${CURRENT_TAG} 変更点"
            echo ""
            echo "- 差分範囲: ${RANGE_TEXT}"
            if [ -n "${COMPARE_URL}" ]; then
              echo "- Compare: ${COMPARE_URL}"
            fi
            echo ""
            echo "### 変更点一覧"
            echo "${COMMITS}"
            echo ""
            echo "### 添付ファイル"
            echo "- ${{ steps.meta.outputs.pdf_output }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release asset
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.version }}
          body: ${{ steps.notes.outputs.release_body }}
          files: ${{ steps.meta.outputs.pdf_output }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          append_body: false
          make_latest: true
          overwrite_files: true

      - name: Prepare GitHub Pages site
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          PDF_OUTPUT_FILE: ${{ steps.meta.outputs.pdf_output }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          sed -i "s|__PDF_FILE__|${PDF_OUTPUT_FILE}|g" _site/index.html
          cp "${PDF_OUTPUT_FILE}" "_site/${PDF_OUTPUT_FILE}"
          PUBLISHED_AT=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            --jq '.published_at // .created_at')
          jq -n \
            --arg version "${GITHUB_REF_NAME}" \
            --arg publishedAt "${PUBLISHED_AT}" \
            --arg releaseUrl "${RELEASE_URL}" \
            --arg pdfFile "${PDF_OUTPUT_FILE}" \
            '{version: $version, publishedAt: $publishedAt, releaseUrl: $releaseUrl, pdfFile: $pdfFile}' \
            > _site/release.json

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
