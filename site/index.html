<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="テック無尽 イベント企画書の最新版をダウンロードできます。">
    <title>イベント企画書＜最新版＞ダウンロード</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17221c;
        --muted: #617067;
        --accent: #176b43;
        --accent-hover: #0f5333;
        --paper: #fffdf8;
        --line: #dce4dd;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        background:
          radial-gradient(circle at 15% 10%, #dcefe1 0, transparent 34%),
          linear-gradient(145deg, #f4f1e8, #eef5ef);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      }

      main {
        width: min(100%, 720px);
        padding: clamp(32px, 7vw, 64px);
        border: 1px solid rgba(23, 34, 28, 0.1);
        border-radius: 24px;
        background: var(--paper);
        box-shadow: 0 24px 70px rgba(31, 55, 40, 0.12);
      }

      .label {
        margin: 0 0 12px;
        color: var(--accent);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.14em;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3.5rem);
        line-height: 1.15;
        letter-spacing: -0.04em;
      }

      .lead {
        margin: 24px 0 32px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.8;
      }

      .download {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 56px;
        padding: 0 28px;
        border-radius: 999px;
        color: white;
        background: var(--accent);
        font-weight: 700;
        text-decoration: none;
        transition: background 160ms ease, transform 160ms ease;
      }

      .download:hover { background: var(--accent-hover); transform: translateY(-1px); }
      .download:focus-visible { outline: 3px solid #8bcfa9; outline-offset: 4px; }

      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 10px 20px;
        margin: 32px 0 0;
        padding-top: 24px;
        border-top: 1px solid var(--line);
        font-size: 0.92rem;
      }

      dt { color: var(--muted); }
      dd { margin: 0; overflow-wrap: anywhere; }
      dd a { color: var(--accent); }

      .error { color: #a12b2b; }
    </style>
  </head>
  <body>
    <main>
      <p class="label">TECH MUJIN</p>
      <h1>イベント企画書<br>最新版</h1>
      <p class="lead">テック無尽のリリース版イベント企画書を、PDF でダウンロードできます。</p>
      <a class="download" id="download" href="./__PDF_FILE__" download="__PDF_FILE__">最新版 PDF をダウンロード</a>
      <dl aria-live="polite">
        <dt>バージョン</dt>
        <dd id="version">読み込み中…</dd>
        <dt>公開日時</dt>
        <dd id="published-at">読み込み中…</dd>
        <dt>リリース情報</dt>
        <dd><a id="release" href="https://github.com/techmujin/techmujin-planning/releases/latest">GitHub Release を見る</a></dd>
      </dl>
    </main>
    <script>
      fetch('./release.json')
        .then((response) => {
          if (!response.ok) throw new Error('release metadata is unavailable');
          return response.json();
        })
        .then((release) => {
          document.querySelector('#version').textContent = release.version;
          document.querySelector('#published-at').textContent = new Intl.DateTimeFormat('ja-JP', {
            dateStyle: 'long',
            timeStyle: 'short',
            timeZone: 'Asia/Tokyo',
          }).format(new Date(release.publishedAt));
          document.querySelector('#release').href = release.releaseUrl;
        })
        .catch(() => {
          document.querySelector('#version').textContent = '取得できませんでした';
          document.querySelector('#published-at').textContent = '取得できませんでした';
          document.querySelector('#version').classList.add('error');
          document.querySelector('#published-at').classList.add('error');
        });
    </script>
  </body>
</html>
